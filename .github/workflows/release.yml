name: Compilar y publicar instalador de Windows
"on": { workflow_dispatch: {} }
permissions: { contents: write }
jobs: { build-and-release: { runs-on: windows-latest, steps: [ { name: "Descargar el codigo", uses: "actions/checkout@v4" }, { name: "Instalar Node.js", uses: "actions/setup-node@v4", with: { node-version: 20 } }, { name: "Instalar dependencias", run: "npm ci" }, { name: "Correr las pruebas", run: "npm test" }, { name: "Obtener el numero de version", id: "pkg", run: "$version = node -p \"require('./package.json').version\"; echo \"version=$version\" >> $env:GITHUB_OUTPUT" }, { name: "Compilar el instalador (sin publicar)", run: "npx electron-builder --win --x64 --publish never" }, { name: "Crear el release y subir los archivos", run: "$files = Get-ChildItem -Path dist/* -Include *.exe,*.blockmap,latest.yml; gh release create \"v${{ steps.pkg.outputs.version }}\" $files.FullName --title \"v${{ steps.pkg.outputs.version }}\" --draft", env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" } }, { name: "Publicar el release (sacarlo de borrador)", run: "gh release edit \"v${{ steps.pkg.outputs.version }}\" --draft=false --latest", env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" } } ] } }
